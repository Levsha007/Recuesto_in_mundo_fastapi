<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel booking</title>
    <link rel="stylesheet" type="text/css" href="/static/css/forms.css">
    <script src="/static/js/forms.js" defer></script>
</head>
<body>
    <div>
        <header>    
            <div class="layers">
                <div class="layer header_fon"></div>
                <div class="layer_header">
                    <div class="later_header_naming">
                        <div class="logo">
                            <a href="/">
                                <img class="logo-img" src="/static/img/logo/logo_white.png" alt="Здесь должен быть логотип">
                            </a>
                        </div>
                        <div class="layers_title">
                            <br>
                            <p>Immergiti in questo </p>
                            mondo
                        </div>
                    </div>
                    <nav>
                        <div class="nav-but aquariums dropdown">
                            <button class="dropdown-button glass" onclick="window.location.href='/aquariums';">Океанариумы</button>
                            <div class="dropdown-content ">
                                <a href="/aquariums#aqm_1">Ripley's Aquarium Of Canada, Канада</a>
                                <a href="/aquariums#aqm_2">Монтерей-Бей, США</a>
                                <a href="/aquariums#aqm_3">Океанариум в Сиднее, Австралия</a>
                                <a href="/aquariums#aqm_4">Океанариум Джорджии, США</a>
                            </div>
                        </div>
                        <div class="nav-but dayving dropdown">
                            <button class="dropdown-button glass" onclick="window.location.href='/dayving';">Дайвинг</button>
                            <div class="dropdown-content">
                                <a href="/dayving#dyng_1">Большой Барьерный Риф</a>
                                <a href="/dayving#dyng_2">Голубая дыра</a>
                                <a href="/dayving#dyng_3">Корраловый риф Туббатаха</a>
                            </div>
                        </div>
                        <div class="nav-but contacts dropdown">
                            <button class="dropdown-button glass">Заказы</button>
                            <div class="dropdown-content">
                                <a href="/form_dvg#form_dvg">Разовый дайвинг</a>
                                <a href="/form_hotel_brn#form_hotel_brn">Бронь отелей</a>
                                <a href="/form_dvg_abt#form_dvg_abt">Абонемент</a>
                            </div>
                        </div>
                        <div class="nav-but login-reg">
                            <button class="glass"  onclick="window.location.href='/login';">Вход/Регистрация</button>
                        </div>
                    </nav>
                </div>
            </div>
        </header>
        
        <main id="form_hotel_brn">
            <div class="container glass" id="container">
                <h2 style="margin-bottom:4%;">Бронь отеля</h2>
                <form id="hotelBookingForm" action="/submit_hotel_booking" method="post" onsubmit="return validateForm('hotelBookingForm')">
                    <label for="name">Имя:</label>
                    <input type="text" id="name" name="name" required>
                
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                
                    <label for="phone">Телефон:</label>
                    <input type="tel" id="phone" name="phone" required>
                
                    <label for="checkin">Дата заезда:</label>
                    <input type="date" id="checkin" name="checkin" required>
                
                    <label for="checkout">Дата выезда:</label>
                    <input type="date" id="checkout" name="checkout" required>
                
                    <label for="room">Тип номера:</label>
                    <select id="room" name="room">
                        <option value="стандарт">Стандарт</option>
                        <option value="люкс">Люкс</option>
                        <option value="семейный">Семейный</option>
                    </select>
                
                    <button type="submit">Забронировать</button>
                </form>
                <a href="/resultPage" style="display:block; margin-top:20px; font-size: 14px;">Посмотреть результаты</a>            </div>
        </main>

        <footer>
            <div class="layers_footer">
                <div class="copy">© Immergiti in questo mondo</div>
            </div>
        </footer> 
    </div>

    <script>
        document.getElementById("hotelBookingForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Предотвращаем обычную отправку формы
            
            if (!validateForm('hotelBookingForm')) {
                return; // Прерываем выполнение, если валидация не пройдена
            }
    
            // Собираем данные из формы
            const formData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                checkin: document.getElementById("checkin").value,
                checkout: document.getElementById("checkout").value,
                room: document.getElementById("room").value
            };
    
            // Получаем текущие данные из localStorage
            const currentData = JSON.parse(localStorage.getItem("hotelBookingFormData")) || [];
    
            // Добавляем новые данные в массив
            currentData.push(formData);
    
            // Сохраняем обновленные данные в localStorage
            localStorage.setItem("hotelBookingFormData", JSON.stringify(currentData));
    
            // Отправляем данные на сервер через AJAX
            fetch('/submit_hotel_booking', {
                method: 'POST',
                body: new FormData(this)
            })
            .then(response => response.json())
            /*.then(data => {
                if (data.success) {
                    alert('Форма успешно отправлена!');
                    // Не очищаем форму, чтобы данные остались
                } else {
                    alert('Произошла ошибка при отправке формы.');
                }
            })
            */
            .catch(error => {
                console.error('Ошибка при отправке формы:', error);
            });
        });
    </script>
</body>
</html>
